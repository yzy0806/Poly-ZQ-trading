[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zq-polymarket-arbitrage"
version = "0.1.0"
description = "Fail-closed ZQ and Polymarket arbitrage monitoring and paper execution engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "orjson>=3.10,<4",
  "polymarket-client>=0.2,<1",
  "prometheus-client>=0.21,<1",
  "protobuf==5.29.5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
zq-arb = "zq_arb.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/zq_arb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["zq_arb"]
omit = [
  "*/adapters/ibkr.py",
  "*/services/engine.py",
  "*/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
